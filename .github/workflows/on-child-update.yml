name: Update specific child

on:
    repository_dispatch:
        types: [child_updated]

permissions:
    contents: write

concurrency:
    group: "pages"
    cancel-in-progress: true

jobs:
    update-specific-child:
        runs-on: ubuntu-latest
        outputs:
            pages_changed: ${{ steps.check_diff.outputs.changed }}
        steps:
            - name: Get child name
              run: echo "TARGET_CHILD=${{ github.event.client_payload.child }}" >> $GITHUB_ENV

            - name: Checkout main
              uses: actions/checkout@v3
              with:
                  ref: main

            - name: Clone updated child only
              run: |
                  echo "Fetching $TARGET_CHILD..."
                  git clone --depth=1 https://github.com/hi2ma-bu4/$TARGET_CHILD.git tmp-child

            - name: Get latest child commit message
              id: get_msg
              run: |
                  cd tmp-child
                  CHILD_MSG=$(git log -1 --pretty=%B)
                  echo "CHILD_MSG<<EOF" >> $GITHUB_ENV
                  echo "$CHILD_MSG" >> $GITHUB_ENV
                  echo "EOF" >> $GITHUB_ENV

            - name: Copy only required files
              run: |
                  rm -rf ./public/$TARGET_CHILD
                  mkdir -p ./public/$TARGET_CHILD
                  cp -r ./tmp-child/test/ ./public/$TARGET_CHILD/ || true
                  cp -r ./tmp-child/dist/ ./public/$TARGET_CHILD/ || true
                  cp -r ./tmp-child/types/ ./public/$TARGET_CHILD/ || true
                  cp ./tmp-child/LICENSE ./public/$TARGET_CHILD/ || true
                  cp -r ./public/$TARGET_CHILD/* ./pages/$TARGET_CHILD/ || true

            - name: Commit & push
              id: check_diff
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  CHILD_MSG: ${{ env.CHILD_MSG }}
              run: |
                  git config user.name github-actions
                  git config user.email github-actions@github.com
                  git add ./public/$TARGET_CHILD/
                  git add ./pages/$TARGET_CHILD/
                  if git diff --cached --quiet; then
                    echo "changed=false" >> $GITHUB_OUTPUT
                    echo "No changes to commit."
                    exit 0
                  fi
                  git commit -m "🔄Update from $TARGET_CHILD: $CHILD_MSG"
                  git push https://x-access-token:${GITHUB_TOKEN}@github.com/hi2ma-bu4/bio.git HEAD:gh-pages
                  echo "changed=true" >> $GITHUB_OUTPUT

    notify-parent:
        runs-on: ubuntu-latest
        needs: update-specific-child
        if: needs.update-specific-child.outputs.pages_changed == 'true'
        steps:
            - name: Dispatch event to gh-pages
              uses: peter-evans/repository-dispatch@v3
              with:
                  event-type: static_pages
