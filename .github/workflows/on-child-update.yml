name: Update specific child

on:
    repository_dispatch:
        types: [child_updated]

permissions:
    contents: write

concurrency:
    group: "pages"
    cancel-in-progress: true

jobs:
    update-specific-child:
        runs-on: ubuntu-latest
        outputs:
            pages_changed: ${{ steps.check_diff.outputs.changed }}
        steps:
            - name: Get child name
              run: echo "TARGET_CHILD=${{ github.event.client_payload.child }}" >> $GITHUB_ENV

            - name: Checkout gh-pages
              uses: actions/checkout@v3
              with:
                  ref: gh-pages

            - name: Clone updated child only
              run: |
                  echo "Fetching $TARGET_CHILD..."
                  git clone --depth=1 https://github.com/hi2ma-bu4/$TARGET_CHILD.git tmp-child

            - name: Get latest child commit message
              id: get_msg
              run: |
                  cd tmp-child
                  CHILD_MSG=$(git log -1 --pretty=%B)
                  echo "CHILD_MSG<<EOF" >> $GITHUB_ENV
                  echo "$CHILD_MSG" >> $GITHUB_ENV
                  echo "EOF" >> $GITHUB_ENV

            - name: Copy only required files
              run: |
                  DEST="./public/$TARGET_CHILD"
                  rm -rf "$DEST"
                  mkdir -p "$DEST"

                  MODE="root"
                  COPY_LIST=()
                  COPY_SUBDIRS=()

                  if [ -d "./tmp-child/test" ]; then
                    echo "Mode: testDir"
                    MODE="test"
                    COPY_LIST=("dist" "types" "test" "LICENSE")

                  elif [ -d "./tmp-child/dist" ]; then
                    echo "Mode: DistDir"
                    MODE="dist"
                    COPY_LIST=("LICENSE")
                    COPY_SUBDIRS=("dist" "types")

                  else
                    echo "Mode: rootDir"
                    MODE="root"
                  fi

                  shopt -s nullglob dotglob extglob
                  if [ "$MODE" = "root" ]; then
                    cp -r ./tmp-child/!(.git) "$DEST/"
                  else
                    for ITEM in "${COPY_LIST[@]}"; do
                      SRC="./tmp-child/$ITEM"
                      if [ -e "$SRC" ]; then
                        cp -r "$SRC" "$DEST/"
                      fi
                    done

                    for DIR in "${COPY_SUBDIRS[@]}"; do
                      if [ -d "./tmp-child/$DIR" ]; then
                        files=( ./tmp-child/"$DIR"/* )
                        if (( ${#files[@]} )); then
                          cp -r "${files[@]}" "$DEST/"
                        fi
                      fi
                    done
                  fi

                  mkdir -p "./pages/$TARGET_CHILD"
                  cp -r "$DEST/"* "./pages/$TARGET_CHILD/"

            - name: Commit & push
              id: check_diff
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  CHILD_MSG: ${{ env.CHILD_MSG }}
              run: |
                  git config user.name github-actions
                  git config user.email github-actions@github.com
                  git add ./public/$TARGET_CHILD/
                  git add ./pages/$TARGET_CHILD/
                  if git diff --cached --quiet; then
                    echo "changed=false" >> $GITHUB_OUTPUT
                    echo "No changes to commit."
                    exit 0
                  fi
                  git commit -m "🔄Update from $TARGET_CHILD: $CHILD_MSG"
                  git push https://x-access-token:${GITHUB_TOKEN}@github.com/hi2ma-bu4/bio.git HEAD:gh-pages
                  echo "changed=true" >> $GITHUB_OUTPUT

    notify-parent:
        runs-on: ubuntu-latest
        needs: update-specific-child
        if: needs.update-specific-child.outputs.pages_changed == 'true'
        steps:
            - name: Dispatch event to gh-pages
              uses: peter-evans/repository-dispatch@v3
              with:
                  event-type: static_pages
