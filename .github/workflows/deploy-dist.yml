name: Deploy to gh-pages

on:
    push:
        branches: [main]

permissions:
    contents: write

concurrency:
    group: "pages"
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout gh-pages branch
              uses: actions/checkout@v3
              with:
                  ref: gh-pages

            - name: Sync dist to pages
              run: |
                  rm -rf ./pages/ || true
                  mkdir -p ./pages/ || true
                  cp -r ./dist/* ./pages/ || true
                  cp -r ./public/* ./pages/ || true

            - name: Commit & Push to pages
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  git config user.name "github-actions"
                  git config user.email "github-actions@github.com"

                  if git diff --quiet -- pages/; then
                    echo "No changes."
                    exit 0
                  fi

                  git add ./pages/
                  git commit -m "Deploy from main"
                  git push https://x-access-token:${GITHUB_TOKEN}@github.com/hi2ma-bu4/bio.git HEAD:gh-pages

    notify-parent:
        runs-on: ubuntu-latest
        steps:
            - name: Dispatch event to gh-pages
              uses: peter-evans/repository-dispatch@v3
              with:
                  event-type: static_pages
